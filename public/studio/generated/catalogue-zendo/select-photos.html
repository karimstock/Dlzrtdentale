.g{display:flex;flex-wrap:wrap;gap:8px}

.c .ck{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:#10b981;color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.c.s .ck{display:flex}.c{position:relative}
#bar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;padding:12px 20px;display:flex;gap:12px;align-items:center;z-index:99}
#bar b{color:#c5a44e;font-size:16px}
#bar button{padding:8px 20px;background:#10b981;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}

const groups={};

const sel=new Set();
let h='';
Object.keys(groups).sort().forEach(k=>{
h+='<div class="sec"><h2>'+k+' ('+groups[k].length+')</h2><div class="g">';
groups[k].forEach(f=>{h+='<div class="c" onclick="t(\''+f+'\',this)"><div class="ck">✓</div><img src="img/products/'+f+'" loading="lazy"><span>'+f+'</span></div>'});
h+='</div></div>'});
document.getElementById('app').innerHTML=h;
function t(f,el){if(sel.has(f)){sel.delete(f);el.classList.remove('s')}else{sel.add(f);el.classList.add('s')}document.getElementById('cnt').textContent=sel.size}
function exp(){const l=Array.from(sel).join('\n');navigator.clipboard.writeText(l).then(()=>alert(sel.size+' photos copiées'));console.log(l)}
