<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JADOMI — Commande confirmee</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0f1e;--bg2:#0f1729;--bg3:#141c2f;
  --surface:rgba(20,30,55,0.7);--surface2:rgba(25,38,68,0.6);
  --border:rgba(99,102,241,0.12);
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --accent:#6366f1;--accent4:#818cf8;
  --success:#10b981;--success2:#34d399;
  --gradient:linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4);
  --shadow:0 4px 24px rgba(0,0,0,0.5);
  --radius:16px;--rs:10px;
  --ease:cubic-bezier(.16,1,.3,1);
  --glass:blur(20px);--glass2:blur(12px);
}
html,body{height:100%;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 30%,rgba(16,185,129,0.1) 0%,transparent 60%),
    radial-gradient(ellipse 60% 80% at 20% 80%,rgba(99,102,241,0.06) 0%,transparent 60%);
}
a{color:var(--accent4);text-decoration:none;transition:color .2s;}
a:hover{color:#a5b4fc;}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:center;padding:14px 28px;border-bottom:1px solid var(--border);background:rgba(15,23,41,0.7);backdrop-filter:var(--glass);position:relative;z-index:50;}
.topbar-logo{font-size:22px;font-weight:900;letter-spacing:-1.5px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* Content */
.success-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:40px 20px;}
.success-card{text-align:center;max-width:520px;width:100%;background:var(--surface);backdrop-filter:var(--glass2);border:1px solid var(--border);border-radius:var(--radius);padding:48px 40px;animation:slideUp .6s var(--ease);}

/* Check circle */
.check-circle{width:88px;height:88px;border-radius:50%;background:rgba(16,185,129,0.1);border:2px solid var(--success);margin:0 auto 28px;display:flex;align-items:center;justify-content:center;animation:scaleIn .5s var(--ease) .1s both;position:relative;}
.check-circle::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(16,185,129,0.15);animation:ringPulse 2s ease infinite;}
.check-circle svg{width:40px;height:40px;color:var(--success);}
.check-circle svg path{stroke-dasharray:50;stroke-dashoffset:50;animation:drawCheck .5s var(--ease) .3s forwards;}

.success-card h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;color:var(--success2);}
.success-card .subtitle{font-size:14px;color:var(--text2);margin-bottom:32px;line-height:1.6;}
.success-card .order-ref{display:inline-block;padding:8px 20px;border-radius:var(--rs);background:rgba(99,102,241,0.08);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--accent4);margin-bottom:24px;font-variant-numeric:tabular-nums;}

.success-actions{display:flex;flex-direction:column;gap:10px;align-items:center;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:13px 32px;background:var(--gradient);color:#fff;border-radius:var(--rs);font-size:14px;font-weight:700;border:none;cursor:pointer;transition:all .3s var(--ease);font-family:'Inter',sans-serif;}
.btn-primary:hover{box-shadow:0 6px 30px rgba(99,102,241,0.4);transform:translateY(-2px);}
.btn-secondary{font-size:13px;color:var(--text3);transition:color .2s;}
.btn-secondary:hover{color:var(--text);}

/* Confetti */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden;}
.confetti{position:absolute;width:8px;height:8px;border-radius:2px;top:-10px;animation:confettiFall 3s ease forwards;}

@keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:scale(1);}}
@keyframes drawCheck{to{stroke-dashoffset:0;}}
@keyframes ringPulse{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:0;transform:scale(1.2);}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

@media(max-width:600px){
  .success-card{padding:36px 24px;}
  .success-card h1{font-size:20px;}
}
</style>
</head>
<body>

<nav class="topbar">
  <span class="topbar-logo">JADOMI</span>
</nav>

<div class="confetti-container" id="confetti"></div>

<main class="success-wrap">
  <div class="success-card">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1>Commande confirmee !</h1>
    <p class="subtitle">
      Votre paiement a ete accepte. Vous recevrez un email de confirmation
      avec le suivi de votre commande sous quelques minutes.
    </p>
    <div class="order-ref" id="orderRef">Chargement...</div>
    <div class="success-actions">
      <a href="/commerce.html" class="btn-primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h12M3 6h8M3 18h5"/></svg>
        Mes commandes
      </a>
      <a href="/commerce.html" class="btn-secondary">Retour au catalogue</a>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';

// Extract order ref from URL params
var params=new URLSearchParams(window.location.search);
var sessionId=params.get('session_id')||'';
var orderId=params.get('order_id')||'';
var $ref=document.getElementById('orderRef');

if(orderId){
  $ref.textContent='Commande #'+orderId;
}else if(sessionId){
  $ref.textContent='Ref. '+sessionId.substring(0,16)+'...';
}else{
  $ref.textContent='Commande enregistree';
}

// Clear cart
localStorage.removeItem('jadomi_cart');

// Confetti
var container=document.getElementById('confetti');
var colors=['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#818cf8','#34d399'];
for(var i=0;i<50;i++){
  var c=document.createElement('div');
  c.className='confetti';
  c.style.left=Math.random()*100+'%';
  c.style.background=colors[Math.floor(Math.random()*colors.length)];
  c.style.animationDelay=(Math.random()*2)+'s';
  c.style.animationDuration=(2+Math.random()*2)+'s';
  c.style.width=(4+Math.random()*6)+'px';
  c.style.height=(4+Math.random()*6)+'px';
  container.appendChild(c);
}

// Clean confetti after animation
setTimeout(function(){container.innerHTML='';},5000);

})();
</script>
</body>
</html>
