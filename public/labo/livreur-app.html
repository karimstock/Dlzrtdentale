<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="format-detection" content="telephone=no">
  <title>JADOMI Livreur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a; --card: #141414; --border: #262626;
      --text: #fafafa; --text2: #a1a1aa; --text3: #71717a;
      --primary: #6366f1; --primary-light: #818cf8;
      --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
      --urgent: #ef4444; --normal: #3b82f6; --light: #8b5cf6;
      --radius: 16px; --transition: cubic-bezier(.16, 1, .3, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      touch-action: pan-y;
      -webkit-user-select: none; user-select: none;
    }

    /* ── Loading Screen ── */
    .screen-loading {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 32px;
      transition: opacity .5s var(--transition);
    }
    .screen-loading.fade-out { opacity: 0; pointer-events: none; }
    .logo-mark {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: white;
      animation: pulse-logo 2s var(--transition) infinite;
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .loading-text { color: var(--text2); font-size: 14px; font-weight: 500; }
    .loading-spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── App Container ── */
    .app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Top Bar ── */
    .top-bar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 12px 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
    }
    .top-bar-left { display: flex; align-items: center; gap: 10px; }
    .top-bar-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: white;
    }
    .top-bar-info h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .top-bar-info .sub { font-size: 11px; color: var(--text2); font-weight: 500; }
    .top-bar-right { display: flex; align-items: center; gap: 8px; }
    .gps-indicator {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--danger);
      transition: background .3s;
    }
    .gps-indicator.active { background: var(--success); animation: gps-pulse 2s infinite; }
    @keyframes gps-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,.4); }
      50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    }
    .settings-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--border); border: none; color: var(--text2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px;
      transition: all .3s var(--transition);
    }
    .settings-btn:active { transform: scale(.9); }

    /* ── Progress Bar ── */
    .progress-bar-container {
      flex-shrink: 0; padding: 8px 16px; background: var(--bg);
    }
    .progress-info {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; font-size: 12px; color: var(--text2); font-weight: 500;
    }
    .progress-track {
      height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: 3px;
      transition: width .6s var(--transition);
    }

    /* ── Main Content Area ── */
    .main-content {
      flex: 1; overflow: hidden; position: relative;
    }

    /* ── Swipe Container ── */
    .swipe-container {
      display: flex; height: 100%;
      transition: transform .4s var(--transition);
    }
    .swipe-container.no-transition { transition: none; }
    .swipe-slide {
      min-width: 100%; height: 100%; overflow-y: auto;
      padding: 16px; padding-bottom: calc(16px + var(--safe-bottom));
    }

    /* ── Stop Card ── */
    .stop-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      animation: card-in .5s var(--transition);
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stop-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
    .stop-number {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--primary); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; flex-shrink: 0;
    }
    .stop-number.done { background: var(--success); }
    .stop-number.absent { background: var(--warning); }
    .stop-number.current {
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,.25);
      animation: current-pulse 2s infinite;
    }
    @keyframes current-pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(99,102,241,.25); }
      50% { box-shadow: 0 0 0 8px rgba(99,102,241,.1); }
    }
    .stop-dentist-name { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .stop-dentist-title { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .stop-address {
      font-size: 14px; color: var(--text2); margin-bottom: 12px;
      line-height: 1.5; padding-left: 62px;
    }
    .stop-phone {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; margin: 0 0 14px 0;
      background: rgba(99,102,241,.1); border-radius: 12px;
      color: var(--primary-light); font-size: 15px; font-weight: 600;
      text-decoration: none;
      transition: all .2s var(--transition);
    }
    .stop-phone:active { transform: scale(.97); }
    .stop-phone svg { flex-shrink: 0; }
    .stop-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 8px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    }
    .badge-urgent { background: rgba(239,68,68,.15); color: var(--urgent); }
    .badge-normal { background: rgba(59,130,246,.15); color: var(--normal); }
    .badge-light { background: rgba(139,92,246,.15); color: var(--light); }
    .badge-livraison { background: rgba(34,197,94,.15); color: var(--success); }
    .badge-recuperation { background: rgba(245,158,11,.15); color: var(--warning); }
    .badge-les_deux { background: rgba(99,102,241,.15); color: var(--primary-light); }
    .stop-meta {
      display: flex; flex-wrap: wrap; gap: 8px;
      font-size: 12px; color: var(--text3); margin-top: 8px;
    }
    .stop-meta-item { display: flex; align-items: center; gap: 4px; }
    .stop-status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      margin-top: 12px;
    }
    .stop-status-badge.done { background: rgba(34,197,94,.12); color: var(--success); }
    .stop-status-badge.absent { background: rgba(245,158,11,.12); color: var(--warning); }

    /* ── Action Buttons ── */
    .action-bar {
      flex-shrink: 0; padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 10px;
    }
    .action-row { display: flex; gap: 10px; }
    .action-row > * { flex: 1; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 56px; border-radius: 14px; border: none;
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all .2s var(--transition);
      text-decoration: none; color: white;
    }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .btn-navigate {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      min-height: 50px; font-size: 14px;
    }
    .btn-arriving {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      min-height: 50px; font-size: 14px;
    }
    .btn-done {
      background: linear-gradient(135deg, var(--success), #16a34a);
      min-height: 60px; font-size: 17px;
    }
    .btn-absent {
      background: transparent; border: 2px solid var(--danger);
      color: var(--danger); min-height: 50px; font-size: 14px;
    }
    .btn-start {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      min-height: 64px; font-size: 18px;
    }
    .btn-end {
      background: linear-gradient(135deg, var(--danger), #dc2626);
      min-height: 56px; font-size: 15px;
    }

    /* ── Empty State ── */
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; text-align: center; padding: 40px 24px;
    }
    .empty-icon {
      width: 80px; height: 80px; border-radius: 24px;
      background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 24px;
    }
    .empty-state h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; color: var(--text2); line-height: 1.6; max-width: 280px; }

    /* ── Completion Screen ── */
    .completion-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; text-align: center; padding: 40px 24px;
      animation: completion-in .8s var(--transition);
    }
    @keyframes completion-in {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .completion-check {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, var(--success), #16a34a);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
      animation: check-pop .6s var(--transition) .2s both;
    }
    @keyframes check-pop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    .completion-check svg { width: 48px; height: 48px; color: white; }
    .completion-screen h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .completion-screen .sub { font-size: 14px; color: var(--text2); margin-bottom: 32px; }
    .completion-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      width: 100%; max-width: 300px; margin-bottom: 32px;
    }
    .completion-stat {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
    }
    .completion-stat .label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .completion-stat .value { font-size: 24px; font-weight: 800; }
    .completion-stat .value.green { color: var(--success); }
    .completion-stat .value.orange { color: var(--warning); }

    /* ── Previous stops (collapsible) ── */
    .prev-stops-toggle {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 12px 16px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 12px;
      color: var(--text2); font-size: 13px; font-weight: 600;
      cursor: pointer; border: none;
      transition: all .3s var(--transition);
    }
    .prev-stops-toggle:active { transform: scale(.98); }
    .prev-stops-toggle svg { transition: transform .3s var(--transition); }
    .prev-stops-toggle.open svg { transform: rotate(180deg); }
    .prev-stops-list {
      overflow: hidden; max-height: 0;
      transition: max-height .4s var(--transition);
    }
    .prev-stops-list.open { max-height: 600px; }
    .prev-stop-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; margin-bottom: 6px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; font-size: 13px;
    }
    .prev-stop-num {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0; color: white;
    }
    .prev-stop-num.done { background: var(--success); }
    .prev-stop-num.absent { background: var(--warning); }
    .prev-stop-name { flex: 1; font-weight: 600; }
    .prev-stop-status { font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .prev-stop-status.done { color: var(--success); }
    .prev-stop-status.absent { color: var(--warning); }

    /* ── Settings Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      z-index: 500; display: none;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-sheet {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px 20px 0 0; width: 100%; max-width: 500px;
      padding: 20px 20px calc(20px + var(--safe-bottom));
      animation: sheet-up .4s var(--transition);
    }
    @keyframes sheet-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 20px;
    }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .nav-option {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; border-radius: 14px;
      border: 2px solid var(--border);
      margin-bottom: 10px; cursor: pointer;
      transition: all .3s var(--transition);
    }
    .nav-option.selected { border-color: var(--primary); background: rgba(99,102,241,.08); }
    .nav-option:active { transform: scale(.98); }
    .nav-option-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .nav-option-icon.waze { background: rgba(51,204,255,.15); }
    .nav-option-icon.gmaps { background: rgba(66,133,244,.15); }
    .nav-option-name { font-size: 15px; font-weight: 600; }
    .nav-option-desc { font-size: 12px; color: var(--text3); margin-top: 2px; }

    /* ── Notes Modal ── */
    .notes-textarea {
      width: 100%; height: 100px; padding: 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-family: inherit;
      font-size: 14px; resize: none; margin-bottom: 16px;
    }
    .notes-textarea:focus { outline: none; border-color: var(--primary); }

    /* ── Confetti ── */
    .confetti-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 999;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute; width: 10px; height: 10px;
      top: -20px;
      animation: confetti-fall 3s linear forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ── Swipe hint ── */
    .swipe-dots {
      display: flex; justify-content: center; gap: 6px;
      padding: 6px 0;
      flex-shrink: 0;
    }
    .swipe-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border); transition: all .3s var(--transition);
    }
    .swipe-dot.active { width: 20px; border-radius: 3px; background: var(--primary); }

    /* ── Toast ── */
    .toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 20px;
      font-size: 14px; font-weight: 600; z-index: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      transition: transform .4s var(--transition);
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
  </style>
</head>
<body>

<!-- ── Loading Screen ── -->
<div class="screen-loading" id="loadingScreen">
  <div class="logo-mark">JD</div>
  <div class="loading-text">JADOMI LABO</div>
  <div class="loading-spinner"></div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<!-- ── Confetti Container ── -->
<div class="confetti-container" id="confettiContainer"></div>

<!-- ── App ── -->
<div class="app" id="app" style="display:none;">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="top-bar-logo">JD</div>
      <div class="top-bar-info">
        <h1 id="topBarTitle">JADOMI Livreur</h1>
        <div class="sub" id="topBarSub"></div>
      </div>
    </div>
    <div class="top-bar-right">
      <div class="gps-indicator" id="gpsIndicator" title="GPS"></div>
      <button class="settings-btn" onclick="openSettings()" aria-label="Paramètres">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar-container" id="progressSection" style="display:none;">
    <div class="progress-info">
      <span id="progressLabel">Progression</span>
      <span id="progressCount">0/0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Swipe Dots -->
  <div class="swipe-dots" id="swipeDots" style="display:none;"></div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <!-- Dynamic content injected here -->
  </div>

  <!-- Action Bar -->
  <div class="action-bar" id="actionBar" style="display:none;">
    <!-- Dynamic buttons injected here -->
  </div>

</div>

<!-- ── Settings Modal ── -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Navigation GPS</div>
    <div class="nav-option" onclick="setNavPref('waze')" id="navOptWaze">
      <div class="nav-option-icon waze">W</div>
      <div>
        <div class="nav-option-name">Waze</div>
        <div class="nav-option-desc">Navigation communautaire en temps réel</div>
      </div>
    </div>
    <div class="nav-option" onclick="setNavPref('gmaps')" id="navOptGmaps">
      <div class="nav-option-icon gmaps">G</div>
      <div>
        <div class="nav-option-name">Google Maps</div>
        <div class="nav-option-desc">Navigation fiable et détaillée</div>
      </div>
    </div>
    <button class="btn btn-navigate" style="margin-top:16px;width:100%;" onclick="closeSettings()">Fermer</button>
  </div>
</div>

<!-- ── Absent Notes Modal ── -->
<div class="modal-overlay" id="notesModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Arrêt — Cabinet absent</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px;">Note optionnelle (porte fermée, pas de réponse, etc.)</p>
    <textarea class="notes-textarea" id="absentNotes" placeholder="Notes (optionnel)..."></textarea>
    <button class="btn btn-absent" style="width:100%;border-color:var(--warning);color:var(--warning);" onclick="confirmAbsent()">Confirmer absent</button>
    <button class="btn" style="width:100%;background:var(--border);margin-top:8px;" onclick="closeNotesModal()">Annuler</button>
  </div>
</div>

<script>
// ─────────────────────────────────
// STATE
// ─────────────────────────────────
const API_BASE = '/api/labo/tournees';
let TOKEN = '';
let state = {
  livreur: null,
  labo: null,
  tournee: null,
  arrets: [],
  currentIndex: 0,
  viewIndex: 0,
  gpsWatchId: null,
  gpsActive: false,
  gpsPingInterval: null,
  lastPosition: null,
  battery: null,
  startTime: null,
  navPref: localStorage.getItem('jadomi_nav_pref') || 'waze'
};

// ─────────────────────────────────
// INIT
// ─────────────────────────────────
document.addEventListener('DOMContentLoaded', init);

async function init() {
  const params = new URLSearchParams(window.location.search);
  TOKEN = params.get('token');
  if (!TOKEN) {
    hideLoading();
    showApp();
    renderError('Token manquant dans l\'URL.');
    return;
  }

  updateNavPrefUI();

  // Try get battery
  if (navigator.getBattery) {
    try {
      const batt = await navigator.getBattery();
      state.battery = Math.round(batt.level * 100);
      batt.addEventListener('levelchange', () => { state.battery = Math.round(batt.level * 100); });
    } catch(e) {}
  }

  await loadTournee();
}

async function loadTournee() {
  try {
    const res = await fetch(`${API_BASE}/app/tournee?token=${encodeURIComponent(TOKEN)}`);
    if (!res.ok) throw new Error('Erreur ' + res.status);
    const data = await res.json();

    state.livreur = data.livreur;
    state.labo = data.labo;
    state.tournee = data.tournee;
    state.arrets = data.arrets || [];

    // Find current stop index (first non-done)
    state.currentIndex = state.arrets.findIndex(a => a.statut !== 'termine' && a.statut !== 'absent');
    if (state.currentIndex === -1) state.currentIndex = state.arrets.length;
    state.viewIndex = state.currentIndex;

    hideLoading();
    showApp();
    render();
  } catch (e) {
    console.error('Erreur chargement:', e);
    hideLoading();
    showApp();
    renderError('Impossible de charger la tournée. Vérifie ta connexion.');
  }
}

function hideLoading() {
  const el = document.getElementById('loadingScreen');
  el.classList.add('fade-out');
  setTimeout(() => el.style.display = 'none', 500);
}

function showApp() {
  document.getElementById('app').style.display = 'flex';
}

// ─────────────────────────────────
// RENDER
// ─────────────────────────────────
function render() {
  updateTopBar();

  if (!state.tournee) {
    renderEmpty();
    return;
  }

  // All stops done?
  if (state.currentIndex >= state.arrets.length && state.arrets.length > 0 && state.tournee.statut === 'terminee') {
    renderCompletion();
    return;
  }

  updateProgress();
  renderStops();
  renderActions();
  renderSwipeDots();
}

function updateTopBar() {
  const title = state.labo ? (state.labo.nom_laboratoire || state.labo.nom_entreprise || 'JADOMI Livreur') : 'JADOMI Livreur';
  document.getElementById('topBarTitle').textContent = title;

  let sub = '';
  if (state.livreur) sub = `${state.livreur.prenom} ${state.livreur.nom}`;
  if (state.tournee) {
    const creneau = state.tournee.creneau || '';
    const creneauLabel = creneau === 'matin' ? 'Matin' : creneau === 'apres_midi' ? 'Après-midi' : creneau === 'journee' ? 'Journée' : '';
    if (creneauLabel) sub += ` — ${creneauLabel}`;
  }
  document.getElementById('topBarSub').textContent = sub;
}

function updateProgress() {
  const section = document.getElementById('progressSection');
  section.style.display = 'block';
  const done = state.arrets.filter(a => a.statut === 'termine' || a.statut === 'absent').length;
  const total = state.arrets.length;
  document.getElementById('progressCount').textContent = `${done}/${total}`;
  document.getElementById('progressFill').style.width = total > 0 ? `${(done / total) * 100}%` : '0%';
}

function renderEmpty() {
  document.getElementById('progressSection').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  document.getElementById('swipeDots').style.display = 'none';
  const laboName = state.labo ? (state.labo.nom_laboratoire || state.labo.nom_entreprise || '') : '';
  document.getElementById('mainContent').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="1.5"><path d="M9 17H7A5 5 0 017 7h2M15 7h2a5 5 0 010 10h-2M8 12h8"/></svg>
      </div>
      <h2>Aucune tournée prévue</h2>
      <p>${laboName ? laboName + ' — ' : ''}Pas de tournée planifiée aujourd'hui. Profite de ta pause !</p>
    </div>
  `;
}

function renderError(msg) {
  document.getElementById('progressSection').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  document.getElementById('swipeDots').style.display = 'none';
  document.getElementById('mainContent').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon" style="border-color:var(--danger);">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <h2>Erreur</h2>
      <p>${msg}</p>
    </div>
  `;
}

function renderStops() {
  const container = document.getElementById('mainContent');
  let html = '<div class="swipe-container" id="swipeContainer">';

  for (let i = 0; i < state.arrets.length; i++) {
    html += `<div class="swipe-slide">${renderStopCard(i)}</div>`;
  }

  html += '</div>';
  container.innerHTML = html;

  // Position to current view
  updateSwipePosition(false);
  initSwipeGestures();
}

function renderStopCard(index) {
  const arret = state.arrets[index];
  const d = arret.dentistes_clients || {};
  const dem = arret.labo_demandes_passage || {};
  const isDone = arret.statut === 'termine';
  const isAbsent = arret.statut === 'absent';
  const isCurrent = index === state.currentIndex;
  const isPast = isDone || isAbsent;

  const dentistName = d.titre ? `${d.titre} ${d.prenom || ''} ${d.nom || ''}`.trim() : `${d.prenom || ''} ${d.nom || ''}`.trim() || 'Cabinet dentaire';
  const address = [d.adresse, d.code_postal, d.ville].filter(Boolean).join(', ');

  const numClass = isDone ? 'done' : isAbsent ? 'absent' : isCurrent ? 'current' : '';

  // Type badge
  const typeMap = {
    livraison: { class: 'badge-livraison', label: 'Livraison' },
    recuperation: { class: 'badge-recuperation', label: 'Récupération' },
    les_deux: { class: 'badge-les_deux', label: 'Livr. + Récup.' }
  };
  const typeBadge = typeMap[dem.type_passage] || typeMap.livraison;

  // Priority badge
  const prioMap = {
    urgent: { class: 'badge-urgent', label: 'Urgent' },
    normal: { class: 'badge-normal', label: 'Normal' },
    faible: { class: 'badge-light', label: 'Léger' }
  };
  const prioBadge = prioMap[dem.priorite] || prioMap.normal;

  let statusBadge = '';
  if (isDone) statusBadge = '<div class="stop-status-badge done"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Terminé</div>';
  if (isAbsent) statusBadge = '<div class="stop-status-badge absent"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Absent</div>';

  // Previous stops section (only on current stop view)
  let prevSection = '';
  if (isCurrent && index > 0) {
    let prevItems = '';
    for (let j = 0; j < index; j++) {
      const pa = state.arrets[j];
      const pd = pa.dentistes_clients || {};
      const pDone = pa.statut === 'termine';
      const pName = pd.titre ? `${pd.titre} ${pd.nom || ''}` : pd.nom || 'Cabinet';
      prevItems += `
        <div class="prev-stop-item">
          <div class="prev-stop-num ${pDone ? 'done' : 'absent'}">${j + 1}</div>

    }
    prevSection = `
      <button class="prev-stops-toggle" onclick="togglePrevStops(this)">

      </button>
      <div class="prev-stops-list">${prevItems}</div>
    `;
  }

  return `
    <div class="stop-card" style="${isPast && !isCurrent ? 'opacity:.6;' : ''}">
      <div class="stop-header">
        <div class="stop-number ${numClass}">${index + 1}</div>
        <div>
          <div class="stop-dentist-name">${esc(dentistName)}</div>
          ${d.titre ? `<div class="stop-dentist-title">Chirurgien-dentiste</div>` : ''}
        </div>
      </div>
      ${address ? `<div class="stop-address">${esc(address)}</div>` : ''}
      ${d.telephone ? `
        <a href="tel:${esc(d.telephone)}" class="stop-phone">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
          ${esc(d.telephone)}
        </a>
      ` : ''}
      <div class="stop-badges">
        <span class="badge ${typeBadge.class}">${typeBadge.label}</span>
        <span class="badge ${prioBadge.class}">${prioBadge.label}</span>
      </div>
      <div class="stop-meta">
        ${dem.references_travaux ? `<span class="stop-meta-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> ${esc(dem.references_travaux)}</span>` : ''}
        ${dem.nb_colis ? `<span class="stop-meta-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg> ${dem.nb_colis} colis</span>` : ''}
      </div>
      ${statusBadge}
    </div>
    ${prevSection}
  `;
}

function renderActions() {
  const bar = document.getElementById('actionBar');
  bar.style.display = 'flex';

  // Tournée not started yet
  if (state.tournee.statut === 'planifiee') {
    bar.innerHTML = `
      <button class="btn btn-start" onclick="startTournee()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Démarrer la tournée
      </button>
    `;
    return;
  }

  // All done
  if (state.currentIndex >= state.arrets.length) {
    bar.innerHTML = `
      <button class="btn btn-end" onclick="endTournee()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        Terminer la tournée
      </button>
    `;
    return;
  }

  // Viewing a past stop
  if (state.viewIndex !== state.currentIndex) {
    bar.innerHTML = `
      <button class="btn btn-navigate" style="background:var(--border);" onclick="goToCurrentStop()">
        Retour à l'arrêt en cours (${state.currentIndex + 1})
      </button>
    `;
    return;
  }

  // Current stop actions
  const arret = state.arrets[state.currentIndex];
  const d = arret.dentistes_clients || {};
  const address = [d.adresse, d.code_postal, d.ville].filter(Boolean).join(' ');

  bar.innerHTML = `
    <div class="action-row">
      <button class="btn btn-navigate" onclick="navigate('${esc(address)}')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        Naviguer
      </button>
      <button class="btn btn-arriving" onclick="notifyArriving(${arret.id})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        J'arrive !
      </button>
    </div>
    <button class="btn btn-done" onclick="validateStop('termine')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      TERMINÉ
    </button>
    <button class="btn btn-absent" onclick="showAbsentModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      Absent
    </button>
  `;
}

function renderSwipeDots() {
  const container = document.getElementById('swipeDots');
  if (state.arrets.length <= 1) { container.style.display = 'none'; return; }
  container.style.display = 'flex';
  let html = '';
  for (let i = 0; i < state.arrets.length; i++) {
    html += `<div class="swipe-dot ${i === state.viewIndex ? 'active' : ''}"></div>`;
  }
  container.innerHTML = html;
}

function renderCompletion() {
  document.getElementById('progressSection').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  document.getElementById('swipeDots').style.display = 'none';

  const done = state.arrets.filter(a => a.statut === 'termine').length;
  const absent = state.arrets.filter(a => a.statut === 'absent').length;
  const total = state.arrets.length;

  let duration = '';
  if (state.tournee.heure_depart) {
    const start = new Date(state.tournee.heure_depart);
    const end = state.tournee.heure_retour ? new Date(state.tournee.heure_retour) : new Date();
    const diffMin = Math.round((end - start) / 60000);
    const h = Math.floor(diffMin / 60);
    const m = diffMin % 60;
    duration = h > 0 ? `${h}h${m.toString().padStart(2, '0')}` : `${m} min`;
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="completion-screen">
      <div class="completion-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>Tournée terminée</h2>
      <div class="sub">${total} arrêt${total > 1 ? 's' : ''} effectué${total > 1 ? 's' : ''}</div>
      <div class="completion-stats">
        ${duration ? `<div class="completion-stat"><div class="label">Durée</div><div class="value">${duration}</div></div>` : ''}
        <div class="completion-stat"><div class="label">Terminés</div><div class="value green">${done}</div></div>
        <div class="completion-stat"><div class="label">Absents</div><div class="value orange">${absent}</div></div>
        <div class="completion-stat"><div class="label">Total</div><div class="value">${total}</div></div>
      </div>
      <button class="btn btn-navigate" style="width:100%;max-width:280px;" onclick="location.reload()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        Actualiser
      </button>
    </div>
  `;

  launchConfetti();
}

// ─────────────────────────────────
// ACTIONS
// ─────────────────────────────────
async function startTournee() {
  try {
    const res = await apiPost('/app/demarrer', { token: TOKEN, tournee_id: state.tournee.id });
    if (res.success || res.tournee) {
      state.tournee.statut = 'en_cours';
      state.tournee.heure_depart = new Date().toISOString();
      state.startTime = Date.now();
      startGPS();
      showToast('Tournée démarrée — Bonne route !', 'success');
      render();
    }
  } catch (e) {
    showToast('Erreur au démarrage', 'error');
  }
}

async function validateStop(statut, notes) {
  const arret = state.arrets[state.currentIndex];
  if (!arret) return;

  try {
    const body = { token: TOKEN, statut_arret: statut };
    if (state.lastPosition) {
      body.latitude = state.lastPosition.latitude;
      body.longitude = state.lastPosition.longitude;
    }
    if (notes) body.notes = notes;

    const res = await apiPost(`/app/arret/${arret.id}/valider`, body);
    if (res.error) throw new Error(res.error);

    // Update local state
    arret.statut = statut;
    state.currentIndex = state.arrets.findIndex(a => a.statut !== 'termine' && a.statut !== 'absent');
    if (state.currentIndex === -1) state.currentIndex = state.arrets.length;
    state.viewIndex = state.currentIndex;

    showToast(statut === 'termine' ? 'Arrêt validé !' : 'Marqué absent', 'success');
    render();
  } catch (e) {
    showToast('Erreur de validation', 'error');
  }
}

function showAbsentModal() {
  document.getElementById('absentNotes').value = '';
  document.getElementById('notesModal').classList.add('show');
}

function closeNotesModal() {
  document.getElementById('notesModal').classList.remove('show');
}

function confirmAbsent() {
  const notes = document.getElementById('absentNotes').value.trim();
  closeNotesModal();
  validateStop('absent', notes || null);
}

async function notifyArriving(arretId) {
  try {
    const res = await apiPost('/app/notifier-arrivee', { token: TOKEN, arret_id: arretId, eta_minutes: 5 });
    if (res.error) throw new Error(res.error);
    showToast('Notification envoyée au cabinet', 'success');
  } catch (e) {
    showToast('Erreur d\'envoi', 'error');
  }
}

async function endTournee() {
  try {
    const res = await apiPost('/app/terminer', { token: TOKEN, tournee_id: state.tournee.id });
    if (res.error) throw new Error(res.error);
    state.tournee.statut = 'terminee';
    state.tournee.heure_retour = new Date().toISOString();
    stopGPS();
    render();
  } catch (e) {
    showToast('Erreur de terminaison', 'error');
  }
}

function navigate(address) {
  if (!address) return;
  const encoded = encodeURIComponent(address);
  if (state.navPref === 'waze') {
    window.open(`https://waze.com/ul?q=${encoded}&navigate=yes`, '_blank');
  } else {
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${encoded}`, '_blank');
  }
}

function goToCurrentStop() {
  state.viewIndex = state.currentIndex;
  updateSwipePosition(true);
  renderActions();
  renderSwipeDots();
}

// ─────────────────────────────────
// GPS
// ─────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) return;

  state.gpsWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      state.lastPosition = pos.coords;
      state.gpsActive = true;
      document.getElementById('gpsIndicator').classList.add('active');
    },
    (err) => {
      state.gpsActive = false;
      document.getElementById('gpsIndicator').classList.remove('active');
    },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
  );

  // Ping every 30s
  state.gpsPingInterval = setInterval(sendGPSPing, 30000);
}

function stopGPS() {
  if (state.gpsWatchId !== null) {
    navigator.geolocation.clearWatch(state.gpsWatchId);
    state.gpsWatchId = null;
  }
  if (state.gpsPingInterval) {
    clearInterval(state.gpsPingInterval);
    state.gpsPingInterval = null;
  }
  state.gpsActive = false;
  document.getElementById('gpsIndicator').classList.remove('active');
}

async function sendGPSPing() {
  if (!state.lastPosition || !state.tournee) return;
  try {
    await apiPost('/app/position', {
      token: TOKEN,
      tournee_id: state.tournee.id,
      latitude: state.lastPosition.latitude,
      longitude: state.lastPosition.longitude,
      precision: state.lastPosition.accuracy || null,
      vitesse: state.lastPosition.speed != null ? Math.round(state.lastPosition.speed * 3.6) : null,
      heading: state.lastPosition.heading || null,
      batterie: state.battery
    });
  } catch (e) {}
}

// If tournée already in progress on load, start GPS
function checkGPSOnLoad() {
  if (state.tournee && state.tournee.statut === 'en_cours') {
    startGPS();
  }
}

// ─────────────────────────────────
// SWIPE
// ─────────────────────────────────
function initSwipeGestures() {
  const container = document.getElementById('mainContent');
  let startX = 0, startY = 0, isDragging = false, moved = false;

  container.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isDragging = true;
    moved = false;
  }, { passive: true });

  container.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
      moved = true;
    }
  }, { passive: true });

  container.addEventListener('touchend', (e) => {
    if (!isDragging || !moved) return;
    isDragging = false;
    const endX = e.changedTouches[0].clientX;
    const dx = endX - startX;

    if (Math.abs(dx) > 60) {
      if (dx < 0 && state.viewIndex < state.arrets.length - 1) {
        state.viewIndex++;
      } else if (dx > 0 && state.viewIndex > 0) {
        state.viewIndex--;
      }
      updateSwipePosition(true);
      renderActions();
      renderSwipeDots();
    }
  }, { passive: true });
}

function updateSwipePosition(animate) {
  const el = document.getElementById('swipeContainer');
  if (!el) return;
  if (!animate) el.classList.add('no-transition');
  el.style.transform = `translateX(-${state.viewIndex * 100}%)`;
  if (!animate) {
    requestAnimationFrame(() => el.classList.remove('no-transition'));
  }
}

// ─────────────────────────────────
// CONFETTI
// ─────────────────────────────────
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#6366f1', '#22c55e', '#f59e0b', '#ef4444', '#818cf8', '#34d399', '#fbbf24'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDelay = (Math.random() * 1.5) + 's';
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    container.appendChild(piece);
  }
  setTimeout(() => { container.innerHTML = ''; }, 5000);
}

// ─────────────────────────────────
// UTILITIES
// ─────────────────────────────────
async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return res.json();
}

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

setTimeout(checkGPSOnLoad, 1000);
