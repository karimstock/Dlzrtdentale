<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Upload Vidéos Formation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080D;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:20px}
.container{max-width:500px;margin:0 auto}
h1{font-size:22px;font-weight:800;margin-bottom:6px}
.sub{font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,0.6);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.field input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#fff;font-size:16px;outline:none}
.field input:focus{border-color:#4dd0e1}
.field input[type="file"]{padding:14px;cursor:pointer}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#4dd0e1,#00acc1);color:#fff;font-size:16px;font-weight:700;border:none;border-radius:12px;cursor:pointer;letter-spacing:0.5px;transition:all .2s}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(0.98)}
.progress-wrap{margin-top:16px;display:none}
.progress-bar{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4dd0e1,#00acc1);border-radius:3px;width:0%;transition:width .3s}
.progress-text{font-size:12px;color:rgba(255,255,255,0.5);margin-top:6px;text-align:center}
.results{margin-top:24px}
.result-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.result-icon{font-size:24px}
.result-name{font-size:13px;font-weight:600;color:#fff;word-break:break-all}
.result-size{font-size:11px;color:rgba(255,255,255,0.4)}
.result-ok{border-color:rgba(76,175,80,0.3)}
.result-err{border-color:rgba(239,83,80,0.3)}
.count{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:12px}
.tip{margin-top:20px;font-size:11px;color:rgba(255,255,255,0.25);line-height:1.5;border-top:1px solid rgba(255,255,255,0.06);padding-top:16px}
</style>
</head><body>
<div class="container">
  <h1>Upload Vidéos Formation</h1>
  <div class="sub">Envoyez vos vidéos depuis le téléphone — elles arrivent directement sur le serveur</div>

  <div class="field">
    <label>Code d'accès</label>
    <input type="password" id="code" placeholder="Code" autocomplete="off">
  </div>

  <div class="field">
    <label>Vidéos à envoyer</label>
    <input type="file" id="files" accept="video/*,image/*" multiple>
  </div>

  <button class="btn" id="sendBtn" onclick="startUpload()">Envoyer</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Préparation...</div>
  </div>

  <div class="results" id="results"></div>

  <div class="tip">
    Formats acceptés : MP4, MOV, WebM, MKV + images JPG/PNG<br>
    Taille max par fichier : 500 MB<br>
    Les fichiers arrivent dans <code>formation/images/</code>
  </div>
</div>

<script>
async function startUpload() {
  const code = document.getElementById('code').value.trim();
  const fileInput = document.getElementById('files');
  const files = fileInput.files;
  if (!code) return alert('Entrez le code d\'accès');
  if (!files.length) return alert('Sélectionnez au moins un fichier');

  const btn = document.getElementById('sendBtn');
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  const results = document.getElementById('results');

  btn.disabled = true;
  wrap.style.display = 'block';
  results.innerHTML = '<div class="count">0 / ' + files.length + ' envoyé(s)</div>';

  let done = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
    text.textContent = (i + 1) + '/' + files.length + ' — ' + file.name + ' (' + sizeMB + ' MB)';
    fill.style.width = '0%';

    try {
      const fd = new FormData();
      fd.append('code', code);
      fd.append('file', file);

      const result = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/formation/upload-video?code=' + encodeURIComponent(code));
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round(e.loaded / e.total * 100);
            fill.style.width = pct + '%';
            text.textContent = (i + 1) + '/' + files.length + ' — ' + file.name + ' — ' + pct + '%';
          }
        };
        xhr.onload = () => {
          if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
          else reject(new Error(JSON.parse(xhr.responseText).error || 'Erreur ' + xhr.status));
        };
        xhr.onerror = () => reject(new Error('Erreur réseau'));
        xhr.send(fd);
      });

      done++;
      results.innerHTML = '<div class="count">' + done + ' / ' + files.length + ' envoyé(s)</div>' +
        '<div class="result-item result-ok"><div class="result-icon">&#10003;</div><div><div class="result-name">' + file.name + '</div><div class="result-size">' + result.size + ' — ' + result.name + '</div></div></div>' + results.innerHTML.replace(/<div class="count">.*?<\/div>/, '');
    } catch (err) {
      results.innerHTML = '<div class="count">' + done + ' / ' + files.length + ' envoyé(s)</div>' +
        '<div class="result-item result-err"><div class="result-icon">&#10007;</div><div><div class="result-name">' + file.name + '</div><div class="result-size">' + err.message + '</div></div></div>' + results.innerHTML.replace(/<div class="count">.*?<\/div>/, '');
    }
  }

  fill.style.width = '100%';
  text.textContent = 'Terminé — ' + done + '/' + files.length + ' fichier(s) envoyé(s)';
  btn.disabled = false;
  btn.textContent = 'Envoyer d\'autres fichiers';
}
</script>
</body></html>
