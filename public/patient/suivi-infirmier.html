<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Votre infirmier(e) arrive — JADOMI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:#f8fafc;height:100vh;display:flex;flex-direction:column}
#map{flex:1;width:100%}
.header{padding:16px 20px;background:#fff;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:12px}
.header-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0d9488,#0d7d6c);display:flex;align-items:center;justify-content:center}
.header-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
.header-text h1{font-size:16px;font-weight:800;color:#1a1a2e}
.header-text p{font-size:13px;color:#6b7280;margin-top:2px}
.bottom-card{padding:20px;background:#fff;border-top:1px solid rgba(0,0,0,.06);box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.eta-big{font-size:36px;font-weight:900;color:#0d9488;text-align:center}
.eta-label{font-size:13px;color:#6b7280;text-align:center;margin-top:4px}
.nurse-info{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(0,0,0,.06)}
.nurse-avatar{width:40px;height:40px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.nurse-name{font-size:15px;font-weight:700;color:#1a1a2e}
.nurse-sub{font-size:12px;color:#6b7280}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;margin-top:12px}
.status-en-route{background:rgba(59,130,246,.1);color:#3b82f6}
.status-arrive{background:rgba(16,185,129,.1);color:#10b981}
.status-waiting{background:rgba(245,158,11,.1);color:#f59e0b}
.absence-btn{display:block;width:100%;margin-top:16px;padding:14px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.12);border-radius:12px;color:#ef4444;font-size:13px;font-weight:700;text-align:center;cursor:pointer}
.absence-btn:active{background:rgba(239,68,68,.15)}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px}
.loading-spinner{width:40px;height:40px;border:4px solid rgba(13,148,136,.15);border-top-color:#0d9488;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="loading-spinner"></div>
  <div style="font-size:14px;color:#6b7280">Chargement du suivi...</div>
</div>

<div id="app" style="display:none;height:100vh;display:none;flex-direction:column">
  <div class="header">
    <div class="header-icon"><svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></div>
    <div class="header-text">
      <h1 id="nurse-title">Votre infirmier(e) arrive</h1>
      <p id="nurse-status">En route vers vous</p>
    </div>
  </div>

  <div id="map"></div>

  <div class="bottom-card">
    <div class="eta-big" id="eta-time">--</div>
    <div class="eta-label" id="eta-label">minutes avant l'arrivée</div>
    <div class="nurse-info">
      <div class="nurse-avatar" id="nurse-initial">?</div>
      <div>
        <div class="nurse-name" id="nurse-name">Chargement...</div>
        <div class="nurse-sub" id="nurse-soin">Soin prévu</div>
      </div>
      <div class="status-badge status-en-route" id="status-badge">
        <div style="width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.5s ease infinite"></div>
        En route
      </div>
    </div>
    <button class="absence-btn" id="absence-btn" onclick="signalAbsence()">
      Je ne serai pas là — Prévenir l'infirmier(e)
    </button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Extraire les params de l'URL : /patient/suivi-infirmier.html?visite=UUID&token=XXX
var params = new URLSearchParams(window.location.search);
var visiteId = params.get('visite');
var token = params.get('token');

if (!visiteId || !token) {
  document.getElementById('loading').innerHTML = '<div style="font-size:16px;color:#ef4444;font-weight:700">Lien invalide</div><div style="font-size:13px;color:#6b7280;margin-top:8px">Ce lien de suivi est incorrect ou a expiré.</div>';
}

var map, nurseMarker, patientMarker, routeLine;
var nurseData = {};

function initApp(data) {
  document.getElementById('loading').style.display = 'none';
  var appEl = document.getElementById('app');
  appEl.style.display = 'flex';

  nurseData = data;
  document.getElementById('nurse-name').textContent = data.nurse_name || 'Votre infirmier(e)';
  document.getElementById('nurse-initial').textContent = (data.nurse_name || '?')[0].toUpperCase();
  document.getElementById('nurse-title').textContent = (data.nurse_name || 'Votre infirmier(e)') + ' arrive';
  if (data.soin) document.getElementById('nurse-soin').textContent = data.soin;

  // Carte
  var patLat = data.patient_lat || 50.6920;
  var patLng = data.patient_lng || 3.1700;

  map = L.map('map', { zoomControl: false }).setView([patLat, patLng], 15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, subdomains: 'abcd'
  }).addTo(map);

  // Marqueur patient (maison)
  patientMarker = L.marker([patLat, patLng], {
    icon: L.divIcon({
      className: '',
      html: '<div style="font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))">&#x1F3E0;</div>',
      iconSize: [28, 28], iconAnchor: [14, 28]
    })
  }).addTo(map);

  // Marqueur infirmier (voiture)
  if (data.nurse_lat && data.nurse_lng) {
    updateNursePosition(data.nurse_lat, data.nurse_lng, data.eta_minutes);
  }

  // Polling toutes les 5 secondes
  setInterval(pollPosition, 5000);
}

function updateNursePosition(lat, lng, eta) {
  if (!nurseMarker) {
    nurseMarker = L.marker([lat, lng], {
      icon: L.divIcon({
        className: '',
        html: '<div style="width:44px;height:44px;border-radius:50%;background:#0d9488;border:3px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><line x1="12" y1="3" x2="12" y2="7" stroke="#fff" stroke-width="3"/><line x1="9" y1="5" x2="15" y2="5" stroke="#fff" stroke-width="3"/></svg></div>',
        iconSize: [44, 44], iconAnchor: [22, 22]
      }),
      zIndexOffset: 1000
    }).addTo(map);
  } else {
    nurseMarker.setLatLng([lat, lng]);
  }

  // ETA
  if (eta !== null && eta !== undefined) {
    document.getElementById('eta-time').textContent = eta;
    if (eta <= 2) {
      document.getElementById('eta-label').textContent = 'Presque arrivé(e) !';
      document.getElementById('eta-time').style.color = '#10b981';
    } else {
      document.getElementById('eta-label').textContent = 'minutes avant l\'arrivée';
    }
  }

  // Ajuster la vue pour voir les 2 marqueurs
  if (patientMarker) {
    var bounds = L.latLngBounds([nurseMarker.getLatLng(), patientMarker.getLatLng()]);
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 16 });
  }
}

function pollPosition() {
  if (!visiteId || !token) return;
  fetch('/api/ide/visite/' + visiteId + '/tracking-live?token=' + encodeURIComponent(token))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) return;
      if (data.status === 'termine' || data.status === 'arrive') {
        document.getElementById('eta-time').textContent = '0';
        document.getElementById('eta-label').textContent = 'Arrivé(e) !';
        document.getElementById('eta-time').style.color = '#10b981';
        document.getElementById('status-badge').className = 'status-badge status-arrive';
        document.getElementById('status-badge').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Arrivé(e)';
        document.getElementById('absence-btn').style.display = 'none';
        return;
      }
      if (data.nurse_lat && data.nurse_lng) {
        updateNursePosition(data.nurse_lat, data.nurse_lng, data.eta_minutes);
      }
    })
    .catch(function() { /* silencieux */ });
}

function signalAbsence() {
  if (!confirm('Voulez-vous signaler votre absence ? L\'infirmier(e) sera prévenu(e).')) return;
  fetch('/api/ide/visite/' + visiteId + '/patient-absent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  }).then(function(r) { return r.json(); })
  .then(function() {
    document.getElementById('absence-btn').textContent = '✓ Absence signalée — l\'infirmier(e) est prévenu(e)';
    document.getElementById('absence-btn').style.background = 'rgba(107,114,128,.08)';
    document.getElementById('absence-btn').style.color = '#6b7280';
    document.getElementById('absence-btn').style.borderColor = 'rgba(107,114,128,.12)';
    document.getElementById('absence-btn').onclick = null;
    document.getElementById('status-badge').className = 'status-badge status-waiting';
    document.getElementById('status-badge').innerHTML = 'Absence signalée';
  })
  .catch(function() { alert('Erreur, réessayez.'); });
}

// Premier chargement
if (visiteId && token) {
  fetch('/api/ide/visite/' + visiteId + '/tracking-live?token=' + encodeURIComponent(token))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        document.getElementById('loading').innerHTML = '<div style="font-size:16px;color:#ef4444;font-weight:700">Lien expir\u00e9</div><div style="font-size:13px;color:#6b7280;margin-top:8px">' + data.error + '</div>';
        return;
      }
      initApp(data);
    })
    .catch(function() {
      document.getElementById('loading').innerHTML = '<div style="font-size:16px;color:#ef4444;font-weight:700">Erreur de connexion</div>';
    });
}
</script>
</body>
</html>
