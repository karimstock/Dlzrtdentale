<!DOCTYPE html>
<html>
<head>
  <base href="/app-preview/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="JADOMI — Application mobile preview">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JADOMI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>JADOMI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body{margin:0;padding:0;background:#0a0a14;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
    .loader{text-align:center;color:#e5e5e5}
    .loader-logo{font-size:32px;font-weight:800;background:linear-gradient(135deg,#0d9488,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;letter-spacing:-1px}
    .loader-bar{width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin:0 auto}
    .loader-bar div{width:40%;height:100%;background:linear-gradient(90deg,#0d9488,#14b8a6);border-radius:4px;animation:load 1.5s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
    .loader-text{font-size:13px;color:rgba(255,255,255,.4);margin-top:12px}
    .loader-error{display:none;font-size:12px;color:#ef4444;margin-top:16px;max-width:300px;line-height:1.5}
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-logo">JADOMI</div>
    <div class="loader-bar"><div></div></div>
    <div class="loader-text">Chargement de l'application...</div>
    <div class="loader-error" id="loader-error">L'application n'a pas pu se charger.<br><a href="javascript:location.reload()" style="color:#14b8a6">Recharger la page</a></div>
  </div>
  <script>
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})});}
    var _t=setTimeout(function(){var e=document.getElementById('loader-error');if(e)e.style.display='block';},15000);
    window.addEventListener('flutter-first-frame',function(){clearTimeout(_t);var l=document.getElementById('loader');if(l)l.style.display='none';});
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
