services:
  docuseal:
    image: docuseal/docuseal:latest
    container_name: jadomi-docuseal
    restart: always
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - docuseal_data:/data
    environment:
      - FORCE_SSL=false
    labels:
      - "com.jadomi.service=docuseal"
      - "com.jadomi.description=Signature electronique JADOMI"

volumes:
  docuseal_data:
    driver: local
